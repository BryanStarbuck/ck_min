  and the parietal regions" of Mr. Kirk's brain. Id. at 3-4.

  When the bullet struck Mr. Kirk, Officer Christopher Bagley of the UVU police was stationed
  on the south end of the walkway roof of the Hall of Flags above Mr. Kirk's canopy. Tr. Day 1
  at 19:10; 20:19-25; 36:6-38:4; State's Ex. 1. Based on his experience with firearms, Bagley
  believed that the bullet came from a rifle fired from a position east of Mr. Kirk's canopy.
  Tr. Day 1 at 66:20-67:17; 69:10, 70:21-71:19.

  Recognizing that (1) the Losee Building was east of the amphitheater, and (2) someone on the
  roof of that building would have a direct line of sight to where Mr. Kirk had been seated,
  Officer Bagley quickly made his way to that roof. Id. at 71:20-72:17. There, he observed a
  screwdriver about 10 or 15 feet from the guardrail. Id. 72:19-73:4; State's Ex. 3.1. He also
  observed disturbances in the gravel at the southwest edge of the roof that were consistent
  with a "sniper pad," meaning a place where a person was "laying in a prone position" with a
  "line of sight" to where Mr. Kirk had been seated. Tr. Day 1 at 87:12-88:15; State's Exs.
  3.2, 4, 5.

  Officer Bagley reviewed surveillance video of the Losee Building rooftop. Tr. Day 1 at
  94:13-95:17, 97:21-98:1. That video shows a male running towards the southwest edge of the
  roof and then dropping down, crawling, and getting into a prone position at that edge of the
  roof. Id. at 95:2-10, 97:23-98:1; Tr. Day 2 at 35:16-36:7; State's Exs. 12.1, 12.4. The video
  further shows that at approximately 12:23:28 p.m. — the moment of the gunshot — that
  individual quickly stood up, ran northeast across the roof carrying a long, skinny, black
  object, and eventually dropped himself down from the northeast side of the roof to the
  ground. Tr. Day 1 at 95:9-10.

