  ‼️BREAKING: Video Captures BLACK SHARDS Falling From Charlie Kirk's Shirt — Evidence of EXPLOSIVE DEVICE, Not Gunshot 😱

  We need to talk about what the footage actually shows.

  Slow-motion analysis of the video reveals something the "official narrative" cannot explain: tiny black shards falling from underneath Charlie's shirt as he collapses.

  Look closely. Frame by frame. As Charlie falls, you can see them — small, dark fragments dropping from his left side, near his belt line, directly in line with his neck wound.

  What are these black shards?

  They're shrapnel. Specifically, debris from the Rode wireless microphone transmitter Charlie was wearing on his belt on his left side.

  That transmitter didn't just malfunction. It exploded.

  This discovery shows an explosive force radiating upward from the device, not an external projectile entering from a rooftop
  THIS WAS NOT A GUNSHOT.

  This was a PETN explosion — a controlled detonation of an explosive device disguised as audio equipment.

  The "assassination" was staged using an IED, not a rifle. The "shooter" on the roof was the distraction. The real weapon was under Charlie's shirt the entire time.

  We're not looking at a lone gunman.  We're looking at  premeditated, close-access execution that required someone with proximity to Charlie — someone who could plant a device on his belt and be near enough to detonate it.

  Someone on his team. Someone in his circle. Someone he trusted.

  The black shards don't lie. The video doesn't lie.

  The only liars are the ones telling you a bullet came from a rooftop when the evidence shows an explosion came from his belt.

  Watch the footage. See the shards. Ask yourself why nobody in law enforcement is talking about the exploding microphone.
