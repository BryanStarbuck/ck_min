  Pastor Jack Hibbs ADMITTED His Brother Butch Is An INTELLIGENCE Asset - "He Is A COVERT Military Operative For The CIA; And In Conjunction With The Mossad"

  Pastor Jack Hibbs was not ambushed by a blog. He said it on camera, in a May 28 conversation about the day Charlie Kirk was killed. He named his brother, Burton "Butch" Hibbs, who has lived in Utah for years. Butch showed up at UVU on September 10 after calling Jack the night before and asking him to pull strings to get him into the event. Jack says the last formal photograph Charlie took was with the two of them. Then Jack added the line he immediately tried to bury: "We have to make sure this does not get out. Some people would say he is a covert military operative for the CIA, and in conjunction with the Mossad."

  That is not selective editing. That is a megachurch pastor and TPUSA Faith fixture attaching his own brother to military intelligence. He tried to dress it as a joke about a mountain man. By then it was too late. He had already said the quiet part out loud. Butch was on the grounds that day. He filmed. He lingered around other witnesses. He was close enough for the last posed picture.

  [Note added by this investigation: We do not claim Butch Hibbs knew anything ahead of time or was involved in any way. Only that whatever was in his front pocket (about the size of a Rode wireless mic receiver) could continue to be investigated.]

  A pastor who uses the pulpit to demand loyalty to a foreign nation just tied his brother to the CIA working with that same nation's service. Ask why those were the words he reached for, and why they came out while he was recounting September 10.
