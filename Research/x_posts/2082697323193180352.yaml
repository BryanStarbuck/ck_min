  [Image 1 of 3 — "Injury Pattern Analysis"]
  FORENSIC HYPOTHESIS COMPARISON
  Injury Pattern Analysis
  Medical Examiner Findings + Acoustic Data
  State of Utah v. Tyler Robinson | UCCU Center, September 10, 2025
  followtheepicenter.com

  HYPOTHESIS A — .30-06 Rifle. Neck Zone 2 entry, 10 deg down, 3 deg L->R.
  Single projectile wound track. 28 / 65, avg 2.2
  HYPOTHESIS B — Shaped Charge. Chest detonation: jet + blast + fragments.
  Three simultaneous injury mechanisms. 57 / 65, avg 4.4
  AGGREGATE EXPLANATORY FIT: RIFLE 33% | SHAPED CHARGE 67%
  RATING SCALE: 1 = Cannot explain, 2 = Requires assumptions, 3 = Possible,
  4 = Strong fit, 5 = Direct prediction

  PATHOLOGICAL FINDINGS (Medical Examiner Report)
  Bilateral hemothorax (left and right) — Rifle 2/5, Shaped charge 5/5, SC +3
  Hemopericardium — Rifle 2/5, Shaped charge 5/5, SC +3
  Bilateral apical pulmonary hemorrhage/hematomas — Rifle 4/5, Shaped charge 4/5, EQUAL
  Bilateral anterior and posterior intercostal hemorrhages — Rifle 2/5, Shaped charge 5/5, SC +3
  Multiple thyroid, cricoid, and tracheal cartilage disruptions — Rifle 4/5, Shaped charge 3/5, R +1

  [Image 2 of 3 — continuation of the table]
  Subarachnoid hemorrhage — cerebellar vermis — Rifle 2/5, Shaped charge 4/5, SC +2
  Subarachnoid hemorrhage — parietal regions — Rifle 1/5, Shaped charge 4/5, SC +3

  ACOUSTIC FINDINGS (11 UCCU Center Recordings, Sept. 10, 2025)
  53 Hz cavity-mode dominant peak (30-60 Hz band) — Rifle 3/5, Shaped charge 5/5, SC +2
  +14.1 dB cavity-to-structural energy ratio (IMG_6368, 10.1m) — Rifle 2/5, Shaped charge 5/5, SC +3
  Low energy above 500 Hz (no Cooper Injury Range signal) — Rifle 3/5, Shaped charge 3/5, EQUAL
  104 microsecond rise time (4.9x faster than PETN) (Canon XA55, Video 15) — Rifle 1/5, Shaped charge 4/5

  BLAST PHYSICS FRAMEWORK (Published Literature)
  Cooper acoustic coupling effect (foam on thorax amplifies injury), Cooper et al. 1991,
  J Biomech — Rifle 0/5, Shaped charge 5/5, SC +5
  Courtney thoracic-to-brain TBI mechanism, Courtney & Courtney 2009, Med Hypotheses —
  Rifle 2/5, Shaped charge 5/5, SC +3

  [Image 3 of 3 — "References & Methodology"]
  METHODOLOGY: Ratings reflect how directly each hypothesis predicts or explains each finding
  without requiring additional assumptions or secondary mechanisms.
  5 = direct first-principles prediction; 4 = strongly consistent; 3 = possible / neutral;
  2 = requires secondary mechanisms; 1 = difficult or impossible to explain;
  0 = mechanism does not apply.

  BLAST INJURY LITERATURE
  [1] Cooper GJ, Townend DJ, Cater SR, et al. 'The role of stress waves in thoracic visceral
      injury from blast loading.' J Biomech 1991; 24:273-284.
  [2] Cooper GJ. 'Protection of the lung from blast overpressures by thoracic stress wave
      decouplers.' J Trauma 1996; 40(Suppl):S105-S110.
  [3] Courtney AC, Courtney MW. 'A thoracic mechanism of mild traumatic brain injury due to
      blast pressure waves.' Med Hypotheses 2009; 72:76-83.
  [4] Courtney MW, Courtney AC. 'Working toward exposure thresholds for blast-induced
      traumatic brain injury.' NeuroImage 2011; 54(S1):S55-S61.
  [5] Cernak I, et al. 'Exposure of the thorax to a sublethal blast wave causes a hydrodynamic
      pulse that leads to perivenular inflammation in the brain.' J Neurotrauma 2014; 31:1292-1304.
  [6] D'yachenko AI, Manyuhina OV. 'Modeling of weak blast wave propagation in the lung.'
      J Biomech 2006; 39:2113-2122.

  RESPIRATORY PHYSIOLOGY
  [7] Hopkins E, Sharma S. 'Physiology, Functional Residual Capacity.' StatPearls 2022.
      FRC in normal adult male approx. 3.0 L (2.5-3.5 L range).
  [8] Breatnach E, Abbott GC, Fraser RG. 'Dimensions of the normal human trachea.'
      AJR Am J Roentgenol 1984; 142(5):903-906.
  [9] Cinar U, et al. 'Tracheal length in adult human: 100 autopsies.' Int J Morphol 2016; 34(1):232-236.

  THORACIC RESONANCE
  [10] CT-FEM of the human thorax. Comput Methods Programs Biomed 2024.
       Resonance frequencies at 28 Hz and 41 Hz (structural modes).
  [11] Goodwin MJ. 'Measurement of Resonant Frequencies in the Human Chest.'
       Proc Inst Mech Eng [H] 1994. Males: 25 Hz, Females: 33 Hz.
  [12] McKusick VA, et al. 'The acoustic basis of chest examination.'
       Am Rev Tuberc 1955; 72:12-34. First resonant freq: ~125 Hz (males).
  [13] DuBois AB, et al. 'Oscillation mechanics of lungs and chest in man.'
       J Appl Physiol 1956; 8(6):587-594.

  ACOUSTIC DATA SOURCES
  [14] Canon XA55 (Video 15): 4-channel 48 kHz/16-bit PCM.
       GPS: 40 deg 16'39.24"N  111 deg 42'48.55"W
  [15] IMG_6368, 13.mp4, 2.MOV, 1.mp4, Video2_1, 7.mp4: cell phone recordings at 1x-4x audio sample rates.
  [16] Analysis window: +30 ms to +200 ms post-event onset.
       Rise time measurement: 104 microseconds (Canon XA55).
