text: |
  ‼️🇺🇸: FULL CONVERSATION of my visit to Cowboy's Smokehouse 0n 7/11/2026 in Panguitch, UT where I interviewed a witness that 100% ID'd Tyler Robinson on the night of Charlie Kirk's assassination between 8:55-9:47pm

  The owner of the restaurant offered to give me a copy of the receipt, pointed out who the witness was, and gave me permission to interview the witness on location.

  Any names mentioned (besides the owner's) have been redacted for the workers' protection.

  TIMESTAMPS 👇🫡

  2:26 Waitress informs me that a witness is there working and the owner calls me while I'm asking if he's there

  4:58 Owner wants me to add context to my previous reporting of why there was no camera working the night Robinson was reported to be at the restaurant on 9/10, says the store is getting harassing phone calls. I agree to update my reporting (and did)

  7:34 Owner tells me he "as far as he knows" he doesn't think it was Tyler Robinson but it "makes sense it could be" (he wasn't there), the staff (eye witnesses) DO think it was Tyler Robinson and the owner offers to give me a copy of the receipt

  12:22 Owner sets RECEIPT in front of me at the counter, says that I can keep it, and that IT "IS the ticket in question"

  13:07 Owner points out the witness who met Tyler Robinson on 9/10 and tells me that I can speak to him

  15:05 Soft interview at the counter with the witness

  19:14 Small talk with owner, tells me history of business, talks a little about the Robinson family, and we discuss the case

  23:06 I ask if I crop out the witness' face if he will do an on-camera interview - he agrees to do the interview

  24:29 Small talk with owner about institutional skepticism

  28:25 Owner gives us permission to use his event room to do the interview

  28:52 Pre-interview conversation with Tyler Robinson eye-witness

  31:00 Full interview with Tyler Robinson eye-witness of September 10, 2025
