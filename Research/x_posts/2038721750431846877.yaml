text: |
  Massive Joe Kent Red Flags🚩🚩🚩

  Here Kent agrees Trump's kept in a "Truman Show-esque" bubble run by Israelis, and he's simply been tricked into the Iran war.

  This is the slop we were sold re: Covid. Fauci just tricked the big orange baby! Trump didn't know any better 🤡

  This clip of Kent (@joekent16jan19), a retired Green Beret combat veteran and former Director of the National Counterterrorism Center, is taken from an interview with Harrison Smith (@HarrisonHSmith) posted to X on March 30, 2026.

  ---------------Partial transcription of clip----------------

  Harrison:

  "My entire life has been war after war, quagmire after quagmire in the Middle East. And to see us falling for it again is inexplicable to me, except in understanding that Trump is sort of kept in this bubble. And you've explained this, and you talk about how it's not just about the advisors around him, but it's about the media he consumes and how they all seem to be sort of working together to present an argument to Trump, and specifically to Trump.

  "I've described it almost like a, it's like Truman Show–esque. They've almost created a false reality around him. I mean, how are they able to do that? And how is that bubble around him not able to be penetrated by people that know better? The Vice president, his sons? I mean, how do they maintain that bubble around him if that's truly what's happening?"

  Kent:

  "From my vantage point, that is basically what happened. And the Truman Show is a good analogy to use. I just call it the echo chamber. But the Israelis have great access to senior decision makers within our government, and within Trump's inner circle and President Trump himself.

  "And so they'll use those relationships basically to kind of circumvent, like, the traditional channels of even having to go through the intelligence community or diplomats. So kind of what we were saying in the IC wasn't necessarily listened to all the time, and it wasn't the best, venue for getting things in front of the president.

  "And then you'd have, at the same time, the media talking head saying almost the exact same thing. So there was definitely a good deal of coordination, with the media talking heads and with what the Israelis were trying to inject into official channels, creating that media echo chamber in particular, it moved President Trump's own red line.

  "I mean, Trump said, Iran can't have a nuclear weapon. The former Supreme Leader said, yeah, we agree. We have a fatwa that's been in effect since '04 that we won't have a nuclear weapon. And so that was a direct threat to the Israelis. The Israelis sought to move the red line to no enrichment. And they basically did that by just repetition, by coming in and saying, no, no, America's policy is what Mike Pompeo said in 2018 when he was your Secretary of State, and he said no enrichment.

  "And then they said that night after night on Mark Levin, the Foundation for Defensive Democracies, putting out think pieces on this getting it ran in the New York Post and the New York Times, until it kind of just became a reality. And then we had a robust debate about the 12-Day War and about Operation Midnight Hammer, leading up to those operations.

  "And there was a lot of dissent. There was a lot of people putting out alternative ways that we could get out of this. And I think because in the end, we sort of, not just me, but a lot of us, called this and said, hey, Midnight Hammer is going to be. It's great if you can just smash these targets and be done. But even if we are successful in that bombing campaign, the Israelis are going to come right back to us and demand regime change.

  "Because, again, the Israelis were very clear about what they wanted. And so I think post, post June, they just, they created a very small circle around President Trump, and he didn't hear any alternatives."
