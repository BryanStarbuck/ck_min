text: |
  NEW: Marjorie Taylor Greene gives her opinion on the Charlie Kirk assassination:

  "I am very much compelled by the lapel-mic stories... and I've shot a .30-06... and I know the damage that that bullet does... so it's hard for me to go along with the traditional narrative"

  "I think there's more there, and I think the investigation seems to have been held back, and I don't think we have the full story"

  "[But] I just haven't waded into it... there's just a lot there that's very questionable. The way his team reacted so quickly, pulling out SD cards, just going around collecting so much equipment and evidence, as Charlie Kirk is bleeding out, and then paving over the area literally two days later"

  "But... you won't find me on social media debating these things. Because guess what? I wasn't at the crime scene. I wasn't there. I wasn't an eyewitness. I'm not in the courtroom"

  "So I'm not saying that I'm an authority on the matter, but I do question a lot of things, and I think it'd be ridiculous for anyone to not question at this point. Where we are in our history to not question things, is, I would consider that unintelligent"

  @FmrRepMTG @BrandonStraka
