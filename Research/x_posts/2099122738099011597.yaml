text: '‼️They Never Play These 911 Calls — “He’s Just Been Shot” And The Rooftop Witness Says It Wasn’t Tyler


  Listen to the first voices after the bang. Not a press conference. Not Blake Neff. The 911 tape.

  “Who was shot in the neck?” “Charlie Kirk was.” “He got rushed off in a black SUV.” “Right in the neck, so I don’t think he has long.” “Did you see it happen?” “Yes. I saw everything.” Parking-lot callers: the whole campus is running. A dad’s daughter texts “shoot.” Dispatch puts the school on lockdown and tells him not to text back because the phone will make noise.


  Then the only person who filmed the figure on the roof before the shot. He stopped recording about five seconds before it fired. He saw a long gun. He watched the man clear the edge, drop, look, run, drop again — tactical movement, all black, face mask, skin covered, about 175 yards out. He thought it was event security until it wasn’t. He reported it on campus that day. He has told Candace the same thing since: that is not the outfit they pinned on Tyler Robinson. Not a t-shirt and jeans. Tactical. And the gun he saw does not match what they are waving in court. There is still no video of Tyler aiming or firing.


  Dispatch said the same thing the media buried. “All black, black long gun, black tactical helmet, a black mask, possibly a tactical vest.” Then another unit: “on top of the building on the far north side, just east of the library… jeans, black shirt, black mask, long rifle.” One shot. Staging at the roundabout. Meanwhile radio tells units the FBI gave “clear direction not to interview” until they arrive. An officer asks to document that there was no autopsy — death certificate signed by the hospital doctor. Then the side channel: Charlie’s wife is landing, Jesse is grabbing a car, nobody can even agree if it’s Signature or Duncan.


  Play the tape. Then tell us again the evidence is “overwhelming.”


  ⚠️If this work matters to you, consider donating. They are trying to cut off the income that keeps this investigation alive. The link is in the post below.👇'
