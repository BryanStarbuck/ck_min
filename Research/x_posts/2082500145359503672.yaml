text: |
  TACTICAL ROOF RUN & THE FORGOTTEN DISAPPEARING SCREWDRIVER
  My best "guesstimate" is that the running figure on the Losee Center roof enters the frame about 1-3 steps past the point where Officer Bagley said he found the screwdriver (15-20 feet past the railing).

  It's a weird sequence they want us to believe:
  1. The gunman went over the railing & walked 15-20 more feet.
  2. Then the gunman stopped. Not right away. Not at 5 feet. Not at 10 feet. Not at 25 feet. Nope: 15-20 feet. That's where he assembled the gun & somehow forgot to stow the screwdriver.
  3. Gunman started sprinting towards vent
  4. And then after running most of the way, he dropped & executed a lengthy tactical lateral crawl several feet to the left to get into position.
  5. When he comes to a stop, he's set up behind the 5 inch roof lip, lying flat. How did he have a line of sight downward into the courtyard when he's back from the edge of the roof, completely behind that lip, flat on the ground of the roof?

  Finally, isn't it convenient that the footage just barely cuts off the view that could corroborate the screwdriver story?

  And don't forget: Officer Bagley testified he put up yellow crime scene tape at the railing to protect the screwdriver evidence, but the KSL helicopter showed conclusively that there was no crime scene tape around the railing, and no screwdriver can be seen on their footage, either.

  I guess we're just supposed to ignore all these little details, huh?
