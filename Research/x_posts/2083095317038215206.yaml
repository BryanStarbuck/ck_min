  🇺🇸 Candace: Patients were removed from the hospital Charlie Kirk was taken to hours BEFORE he was shot

  "Over two hours before Charlie was shot, the Timpanogos Hospital staff directed everyone who was in the emergency room into a different wing of the hospital.

  Then, after some time, at approximately 1130 a.m, patients were informed that they would be transferred aboard shuttles to Intermountain Hospital; that's Utah Valley Hospital, and that's what happened.

  All of the emergency room patients and all of their files were then transferred to Intermountain.

  So there's effectively no trail outside of hospital cameras, which have been conveniently seized by Kash Patel's office, of these patients ever having been at Timpanogos Hospital."

  Source: @RealCandaceO / Writer: Ian
