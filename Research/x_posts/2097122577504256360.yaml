  text: |
    BREAKING: A Utah Valley University (UVU) student contacted the FBI after the assassination of Charlie Kirk.

    The student reported seeing a man resembling the person of interest near the roof of the Losee Center twice in the weeks before the assassination.

    The shooter is believed to have fired a single shot from the roof of the Losee Center, which overlooks the campus courtyard where Charlie Kirk was speaking.

    The student says they saw a tall, skinny, dark-haired man in dark clothes on the roof of the Losee Center on two separate occasions.

    The most recent sighting was at noon on the Wednesday a week before the shooting.

    The student found the man's presence on the roof unusual. A professor attempted to speak with the man, but he was ignored.

    After seeing the FBI's photos of a person of interest in connection with the shooting, the student reported the sightings to the FBI tipline.

    The student has NOT heard back from the FBI regarding the tip.
