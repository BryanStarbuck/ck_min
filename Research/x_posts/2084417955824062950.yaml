  ‼️BREAKING: Candace Owens REVEALS The Identity Of The Mystery OFFICER On The Losee ROOFTOP With Officer Bagley! 👀

  Officer Bagley testified he was on the Losee building rooftop with a plain-clothes officer… but claimed he couldn't remember the man's name or anything about him.
  Candace just identified him.

  Bystander footage from 12:47 PM shows the second man clearly. He is Officer Alan Robinson of the Utah State University Department of Public Safety — not even a UVU officer.

  Robinson had only joined the USU police force the summer before. On paper he was a relative newcomer sent over as general reinforcement.

  Yet in the early footage he appears to be the one directing activity on that rooftop. Officer Bagley, for reasons still unexplained, could not (or would not) name him under oath.

  A brand-new officer from a different university ends up on the critical rooftop minutes after the shooting, seems to be running the show, and the only UVU officer up there with him suddenly has amnesia about his identity.
  Candace is right — this is not tracking.
