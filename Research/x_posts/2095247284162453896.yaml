image_content_description: |
  Google Earth 3D perspective render of southwest Utah looking northeast. A red
  ADS-B track ribbon (vertical drop-lines to the ground, indicating altitude)
  enters from the northwest past Bunkerville/Mesquite, runs southeast over
  St. George and Washington, makes a tight hairpin turn directly over the
  labelled "Washington County Sheriff" placemark, then loops out east past
  New Harmony, Kanarraville, Hamilton Fort and Cedar Highlands before doubling
  back. A second long leg runs southwest across Colorado City, Cane Beds and
  the Kanab Indian Reservation. Zion National Park, Hurricane, Toquerville,
  Springdale and Rockville are labelled. Timestamp burned into the upper left:
  "9/11/2025  8:41:37 pm". Attribution strip at bottom: Image Landsat / Copernicus,
  Data SIO NOAA U.S. Navy NGA GEBCO, Data LDEO-Columbia NSF NOAA.
