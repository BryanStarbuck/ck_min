  text: "The first TPUSA stop back in Utah was announced as Mike Lee, Spencer Cox,\
    \ Andy Biggs, and Jason Chaffetz. Lee sent a video. Cox, Biggs, and Chaffetz were\
    \ there, with Tyler Bowyer on the panel.\n\nAll five are Latter-day Saints. \n\
    \nJason Chaffetz was also at UVU on 9/10, in the crowd with his family. The September\
    \ 2 memo is reported as Kirk removing Bowyer from his role of TPUSA chief operating\
    \ officer and within Turning Point Action only.\n\nWith Charlie’s 2022 post saying\
    \ Cox should be expelled from the Republican Party, and a reported push for a\
    \ DOGE-style review, it is just hard not to notice who they put on the lineup."
