text: "On September 4, 2025, six days before the UVU shooting, Utah Lt. Gov. Deidre\
  \ Henderson’s public schedule put her at Cowboy’s Smokehouse Cafe in Panguitch,\
  \ Utah for an 11:30 a.m. lunch. Spencer Cox was in Washington, D.C., that day.\n\
  \nOn September 12, 2025, Utah Lt. Gov. Deidre Henderson was at the UVU press conference\
  \ with Cox and FBI Director Kash Patel when Cox said “we got him.” \n\nThat was\
  \ the announcement that Tyler J. Robinson was in custody."
