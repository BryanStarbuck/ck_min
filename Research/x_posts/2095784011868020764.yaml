  BOMBSHELL: CNN Originally Reported That The Screwdriver Was FOUND "Near The Rifle" In The Woods — Then The Story Changed To The ROOF.

  On September 11, CNN claimed the investigators found the screwdriver in the woods with the gun. Evan Perez said the suspect dumped the rifle, there was a towel, and they also found a screwdriver. Pamela Brown said authorities recovered it "right near the rifle they found." The Telegraph and New York Magazine repeated it: woodland, next to the bolt-action, used to take the stock off. Four days later Kash Patel put the same screwdriver on the Losee roof and tied DNA to it. That is the version that eventually stuck.

  That flip is the problem. Officer Bagley later testified he found a red-and-black screwdriver on that roof about 10 to 15 feet inside the guardrail. His body camera, according to the record and his testimony, cuts out before he claims he found it. And in the Losee rooftop CCTV footage @RealCandaceO released, the figure on that roof never pulls a screwdriver and never assembles a rifle on camera. You are asked to believe a tool jumped from the woods to the sniper pad, that the camera died at the exact moment it mattered, and that the assembly happened in a blind spot the public is not allowed to see.

  If the official story is airtight, release the uncut roof cam, the Bagley body-cam file, and the original evidence log that shows where that screwdriver was first tagged. Until then the September 11 CNN line and the September 15 roof line cannot both be true.

