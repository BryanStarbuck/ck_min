text: |
  Here we take a closer look at Tyler Robinson's alleged locations on 9/10 including UVU, a nearby Dairy Queen and Cowboy's Smokehouse to see which paths and times makes the most sense logistically.

  From review its easy to see Cowboys in Panguitch could have been a stop though it would add over an hour of travel time to the trip between UVU and his home.

  If it turns out the smokehouse receipt is his, then it would make less sense that he would go out far from path to home to go eat there and then drive back to UVU to retrieve his rifle.

  One could argue he wanted to be a few hours from home as well as from UVU that evening, but he had to known his wanted stars wouldn't just disappear the next day.
