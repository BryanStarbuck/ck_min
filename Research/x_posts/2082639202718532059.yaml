  image_1: |
    @ruthmayforth5933 - 38 min ago (edited)

    I am a surgeon. Based on the medical examiner's report, the trajectory from the roof is NOT
    POSSIBLE. Charlie was hit in the low neck. The medical examiner's report said much of his
    cervical spine was traumatically gone, and the L side of C2-C7 was obliterated. To have
    affected up to C2, it would have had to be an upward trajectory from the point of entry on
    the neck. I heard a podcaster (Project Constitution) say that Charlie was also wearing a Rode
    transmitter at his L waist, if this had a shaped charge, the trajectory would make sense for
    entering the low neck and hitting his cervical spine.

    321 likes | 13 replies
  image_2: |
    @wildgeese5707 - 30 min ago

    I am retired from medicine (cardiology). I paused Candace's show to read that report and was
    shocked. The trauma to the carotid and jugular veins make sense. The cervical spine and spinal
    cord, I'm okay with. But the injury to the heart and lungs? No. That sort of injury is either
    from a blunt force trauma, like a terrible head on car crash or crushing accident with
    industrial machinery. Or, and I didn't think of this possibility until just a half an hour ago,
    an explosion that went off inside of him.

