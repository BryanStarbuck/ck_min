  ‼️EXPOSED: Witness Reveals The FBI SEIZED All Clothing From Charlie's SECURITY Team — Down To Their Boxer Briefs. 👀

  Candace Owens just dropped another major detail from her ongoing investigation.

  According to information she received, the FBI took the clothing from certain members of Charlie's security detail — all the way down to their boxer briefs. This comes after months of unanswered questions about why Frank Turek and others ended up in hospital scrubs, the conflicting accounts of who actually performed CPR in the vehicle, and how blood ended up on specific people.

  In a normal investigation, seizing clothing would be standard evidence collection. Candace pointed out this was not a normal situation. The same federal authorities who moved quickly to have the vehicle towed, cleaned, and prepared for resale are the ones who stripped the security team of their clothes. She raised the possibility that the clothing was not preserved for testing but removed to eliminate potential evidence.

  Only Tyler Robinson's defense team is in a position to force disclosure of what actually happened to those items. Until then, the public is left with yet another unexplained action by the same agencies that have controlled the narrative from the start.

  FOLLOW @RealCandaceO , RT and watch her FULL episode linked below.👇
