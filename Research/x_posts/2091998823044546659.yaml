text: |
  ‼️BOMBSHELL: The Fragment In Charlie's Neck Appears To Be Black Charred ABS Plastic, Not Lead 👀

  New analysis of the fragments recovered from Charlie Kirk's neck is raising serious questions. One of the pieces recovered inside the wound appears to be black ABS-style plastic, the same type of material used in the housing of the Rode wireless microphone transmitter that was on him that day.

  When you zoom in, the fragment shows clear bubbles. Lead from a bullet does not melt and resolidify with that kind of bubbled texture. Charred, melted plastic does. The theory being examined is that the wireless mic transmitter was rigged with a PETN shaped charge causing an explosion that sent plastic shrapnel upward into Charlie's neck.

  In the preliminary hearing, the ATF analyst acknowledged recovering a jacket fragment "as well as some other fragments." The phrase "other fragments" was left vague. If those other pieces are plastic, the public has a right to know why that detail has not been clearly addressed.

  Charlie was wearing a wireless mic transmitter. The material matches. The physical characteristics of the fragment do not match typical lead. The official description stays carefully incomplete. That combination demands a full, transparent accounting of exactly what was pulled from the wound.

  Shoutout to the amazing @Its_KK_1 for finding me this video. FOLLOW Her!
