ocr_text: |
  The medical examiner concluded the manner of death "to be homicide." State's Ex. 11 at 1.
  A forensic examination conducted by the ATF revealed that the bullet that killed Mr. Kirk was
  a .30 caliber class round. State's Ex. 32 at 2. It created a "complex entrance gunshot wound" and
  fragmented in Mr. Kirk's neck. State's Ex. 11 at 1, 3.
