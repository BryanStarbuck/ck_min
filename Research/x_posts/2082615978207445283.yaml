text: |
  Although we didn't get the autopsy report, the State has shared a lot of details of its findings in their memorandum supporting bindover of Tyler Robinson. The complex entry wound coupled with fragmentation is consistent with the bullet destabilizing before impact, such as due to yaw. There are many other very specific details of the damage caused to Charlie that are consistent with extensive fragmentation of a rifle bullet.

