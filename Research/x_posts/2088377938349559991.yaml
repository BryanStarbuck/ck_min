  [Card 3 — point 6]
  6. Unlike a gunshot that depends on PHYSICAL IMPACT to generate high speed radial acceleration,
  explosives use chemical conversion of chemicals to generate radial expansion which in turn
  accelerate projectiles. EXPLOSIVE = [diagram] GUNSHOTS = [diagram]
  This explains exactly why there is radial expansion before there is any kind of wound.

  [Screenshot — explosion sequence]
  with explosives does radial expansion first then blunt impact
  Yes, that sequence is correct. An explosion starts with a rapid, supersonic radial expansion of a
  shock wave and high-pressure gases, which then strikes a target to deliver a heavy blunt impact or
  mechanical force.
  * Radial Expansion: The chemical reaction moves outward from the center. It forms a supersonic
    shock front and expanding gas bubble.
  * Blunt Impact: The expanding shock wave and high-pressure blast wind smash into nearby surfaces.
    This transfers massive kinetic energy and causes physical trauma or structural deformation.
  * Heave and Drag: Following the initial high-pressure blow, the expanding gases push materials
    away or create a vacuum effect ("blast ...")

  [Screenshot — terminal ballistics]
  No, a bullet does not experience blunt impact after radial expansion; rather, the initial physical
  resistance (blunt impact/deceleration) happens at the exact same micro-instant contact and
  triggers the radial expansion (mushrooming) simultaneously.
  * Initial Contact: The bullet nose strikes the target medium, creating an instantaneous physical
    resistance and deceleration shock.
  * Simultaneous Deformation: The pressure from this impact forces soft lead or hollow cavity
    structures backward, causing the outer edges to flare outward radially at the same time the
    kinetic energy transfer begins.
  * Energy Transfer: The radial widening creates a larger wound channel and brakes the projectile,
    converting the forward momentum into a wider energy spread inside the target.
