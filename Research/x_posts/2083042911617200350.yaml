ocr_text: |
  [Image 1] Likelihood of Explosive Residue Transfer & Detectability on Synthetic Fibers.
  TRANSFER: HIGH - Handling or proximity to detonation readily transfers particles to synthetic
  surfaces. Fingerprint-level and post-blast residues common.
  TRAPPING IN FIBERS: HIGH - Nylon, polyester, and auto carpet (typically nylon or polyester blends)
  are porous and fibrous - particles lodge between fibers and in the pile. Better retention than many
  smooth surfaces.
  TESTABILITY / RECOVERY: MEDIUM-HIGH - Solvent extraction (acetone/methanol) + HPLC-UV or LC-MS
  recovers residues effectively. Nylon often shows higher recovery than cotton; polyester/auto carpet
  also workable. Detection at low ug/g to ng levels possible when properly sampled.
  Ranking: Nylon (high recovery) > Polyester / Auto Carpet (good-high) > Cotton (lower).
  Footer: Based on forensic studies of post-blast and handling residues (RDX, PETN, TNT-related
  compounds). Actual results depend on amount deposited, time, weathering, washing, and extraction
  method. Outdoor or heavily soiled carpet reduces likelihood.
