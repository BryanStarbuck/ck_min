text: |
  "Residues of military/high explosives (e.g., RDX, PETN, TNT-related compounds) have been detected on fabric after detonations or simulated post-blast conditions. One HPLC study recovered RDX at low concentrations (around 3-4 ug/g) from nylon and cotton cloth exposed in post-blast scenarios; recovery varied strongly by fabric type (better from nylon than cotton; none from denim in that work)."
