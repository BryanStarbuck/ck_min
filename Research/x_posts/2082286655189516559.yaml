text: |
  The key point that most are missing is not that "wow, that's too high to jump off of." Obviously, we watched someone make that leap. For me, what's most interesting is the commitment, the lack of hesitation, the determination and intention to make that leap.

  That roof is 16-20 feet high. At no point does the jumper hesitate, or pause to look around and take stock of the situation. Without rehearsal and practice, most people would take a beat here. Not this guy. He headed straight for that corner and did a Peter Pan like he'd done it a hundred times before.

  But nowhere in the hearing did the prosecution indicate that Tyler had ever even scoped out that spot, or evaluated it as an egress point. Most average people would probable retreat back the way they came. Not our jumper. He knew right where to head, and exactly what to do when he got there.

  There was no pause. No hitch. No caution. No dithering. No trepidation. No fussing about trying to figure out the best sptot to start hanging down. No exploration of the two sides of the corner. The average person doesn't naturally head to a 16 foot roof and just hope it'll all work out, which is what they're asking us to believe about Tyler: that without rehearsal, practice or evaluation beforehand, he leapt up after his shot and headed straightaway to an unknown corner and knew exactly what to do once he was there, even though nothing would have prevented him from simply running back down the stairs the way he came, like an average untrained "assassin."

  Go find a 20 foot roof with a rifle and backpack, and see how long it takes you to decide to climb down. Don't blink or hesitate. This guy didn't.

  He didn't even fumble around with the gun. His foot placement was perfect. His movements to transfer the gun were perfect and efficient. Totally fluid. Again, no bumbling or extraneous actions. You simply won't convince me that these are the actions of a scrawny kid who's never killed anyone before and is a bit of an egghead who's really good at math.
