ocr_text: |
  All the people that trusted you, Jews and Christians. Including me! Why would you platform
  anti-Semites like Candace and Tucker? There are many Evangelical Christian Zionists who would
  never give these people the opportunity to spew their hatred. I'm one of them. You say people
  are accusing you of being an antisemite because you disagree with the Israeli government. Well
  what is it exactly that you disagree with? You threatened Jews and Christians with your 30 mn
  followers? Are you kidding?! Be very careful, Charlie. You are in violation of the 9th
  Commandment, by bearing false witness against your brother, Judah. When was the last time you
  read your Bible, Charlie. I'm coming to you as a believer. Gen. 12:3, Obadiah and many more
  prophets warn those who curse Israel will be cursed. Your TPUSA Tampa event was a disaster!
  Michele Bachmann was booed and about 10 percent walked out on her when she talked about standing
  with Israel? You brag about how you convinced all these young voters to vote for Trump but you
  can't convince them to stand with our Jewish brethren? This is not a joke, Charlie. I'm coming
  to you as a sister in the faith. You have accomplished so much by the hand of The Almighty, but
  He is going to lift His hand from you. Don't fall for Tucker, Candace and the rest. The Jews are
  under attack. G-D warns us in the last days that He will wipe out the descendants of Edom
  because they stood by while their brother Jacob/Israel was held in captivity and did nothing.
  Don't be counted among the Edomites.
