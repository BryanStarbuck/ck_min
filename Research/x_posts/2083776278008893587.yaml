text: |
  This dude nails it. I love how he addresses the scope situation which is by far the craziest part. Siting a scope takes a while and requires you shoot live ammo while you do it. Just putting the gun in your pants let alone disassembling it would make the scope useless.

  I love that this is a format honest gun owning dudes can do now. A lot of dudes get super frustrated by how psychotic the narrative is. I find the ballistics examples great and dudes recreating the exact shot w a pig head like @valhallavft
  But this example of just clothing works on people that know nothing about guns but have simply worn clothing. I saw it click with women especially.

  Choosing to forget and play make believe because you're scared doesn't help you at all. I understand these things are upsetting and scary, but forgetting choosing to forget your experiences and your logic makes you vulnerable. It does not keep you safe.
  I knew @RealCandaceO was onto something the way they attacked her.

  I'm literally a comedian who used to get paid to mock people who threw tomatoes at me at a renn faire. I love good jokes and mockery that picks at ego and identity. This was not that. They are claiming they know her soul is evil simply because she respected Charlie enough to remember. And for that she has my respect and I know I'm not alone in that feeling.
  And being a victim of childhood bike theft it takes a while for me to trust "one of them...." But Candace is solid
