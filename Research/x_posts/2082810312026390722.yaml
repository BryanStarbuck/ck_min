text: |
  Leaked information attributed to Timpanogos Hospital staff appears consistent with the attached
  Medical Examiner's Report extracts and the attached doctors' analysis.

  *"The doctors that worked on him had never seen anything like what killed Charlie. They all
  believe it was some kind of specialized tech. There was no exit wound, his spine was obliterated.
  They think it could've been some kind of small bomb that penetrated his body, and the blood that
  burst from his neck was from the explosion that happened within his body.*

  "They've seen the X-rays. They intimately know what they're talking about. The 'exploding mic'
  theory (or some type of small explosive) seems to be what the majority of the staff—doctors,
  nurses, and administrators—believe is what killed him."

  The first two images are extracts from the Medical Examiner's Report.

  The final two images are comments from doctors discussing the wording of the Medical Examiner's
  Report.

  What does this mean for the official federal narrative?
