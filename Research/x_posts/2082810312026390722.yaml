ocr_text:
  image_1: |
    [Page 2 of the State's brief. Red underlining added by the poster.]

    questioning him when a gunshot rang out and a bullet struck the left side of Mr. Kirk's neck,
    killing him. Tr. Day 1 at 66:20-67:17; 69:10; Tr. Day 2 at 10-11; State's Exs. 7, 8, 11 at 1.
    The bullet's trajectory was front to back, slightly left to right, and downward. State's
    Ex. 11 at 1, 4.

    The investigation

    The medical examiner concluded the manner of death "to be homicide." State's Ex. 11 at 1. A
    forensic examination conducted by the ATF revealed that the bullet that killed Mr. Kirk was a
    .30 caliber class round. State's Ex. 32 at 2. It created a "complex entrance gunshot wound"
    and fragmented in Mr. Kirk's neck. State's Ex. 11 at 1, 3.

    The bullet, or at least parts of it, "sequentially perforated the anterior left side of [Mr.
    Kirk's] neck, strap muscles of the left side of the neck, [and the] left common carotid and
    left internal and external jugular veins." State's Ex. 11 st 3. The bullet also "obliterate[ed]
    the left side of the C2-7 vertebrae and transect[ed] the cervical spinal cord." Id. The medical
    examiner observed that "[a] significant portion of [Mr. Kirk's] cervical spinal cord [was]
    traumatically
  image_2: |
    [Page 3 of the State's brief. Red underlining added by the poster.]

    absent." Id. at 3-4. Mr. Kirk suffered other severe injuries including "bilateral apical and
    posterior intercostal hemorrhages, pulmonary apical hemorrhages/hematomas ... and multiple
    disruptions of the thyroid, cricoid, and tracheal cartilages." Id. at 3. The medical examiner
    also observed hemorrhaging around Mr. Kirk's heart ("hemopericardium"), both of his lungs
    ("left and right hemothorax"), and in the subarachnoid space around "the cerebellar vermis and
    the parietal regions" of Mr. Kirk's brain. Id. at 3-4.

    When the bullet struck Mr. Kirk, Officer Christopher Bagley of the UVU police was stationed on
    the south end of the walkway roof of the Hall of Flags above Mr. Kirk's canopy. Tr. Day 1 at
    19:10; 20:19-25; 36:6-38:4; State's Ex. 1. Based on his experience with firearms, Bagley
    believed that the bullet came from a rifle fired from a position east of Mr. Kirk's canopy.
    Tr. Day 1 at 66:20-67:17; 69:10, 70:21-71:19.
