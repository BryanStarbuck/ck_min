     State's cherry picked [selection]." Matt accepted the correction at 14:43: "Thanks Slick Dog.
     Yes me too."

  2. @BasedSamParker (15:51) asked for sourcing on the leaked hospital quote. Matt (16:27) replied
     the source wants anonymity and quoted his source saying "I am purposely holding back the job
     title of the person who shared this info with my friend." Sam (16:31): "So your source is
     allegedly a leak via a 3rd party. You should say that in the first place." Matt (16:33): "Yes,
     I've had this since November."

  Sub-debate on CPR as an alternative cause of the chest injuries:
