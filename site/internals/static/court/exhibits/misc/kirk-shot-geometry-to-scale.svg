<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A1F2B"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1000" height="660" fill="#F6F1E6"/>

  <!-- ============ TITLE ============ -->
  <text x="60" y="44" font-size="26" fill="#1E1A16" font-weight="bold" letter-spacing="1">THE 6.1&#176; SHOT &#8212; DRAWN TO SCALE</text>
  <text x="60" y="66" font-size="13" fill="#5A5347">430 ft horizontal &#183; ~45.6 ft vertical drop &#183; same scale on both axes (1 ft = 2 px)</text>
  <line x1="60" y1="78" x2="940" y2="78" stroke="#C9A227" stroke-width="2"/>

  <!-- ============ MAIN PANEL (2 px per foot, both axes) ============ -->
  <!-- baseline: courtyard ground y=260; muzzle (70,160); Kirk neck (930,251.2) -->

  <!-- terrain: high ground under Losee, slope down to courtyard -->
  <path d="M 10,210 L 200,210 L 500,260 L 950,260 L 950,272 L 10,272 Z" fill="#E4DAC4" stroke="#B7A98A" stroke-width="1"/>

  <!-- Losee Center building (2 stories on the high ground) -->
  <rect x="10" y="160" width="60" height="50" fill="#CBBFA5" stroke="#8A7B5E" stroke-width="1.5"/>
  <line x1="10" y1="185" x2="70" y2="185" stroke="#8A7B5E" stroke-width="0.75"/>
  <text x="14" y="152" font-size="11" fill="#5A5347">LOSEE CENTER ROOF</text>

  <!-- prone shooter (6 ft long = 12 px) -->
  <rect x="52" y="156.5" width="12" height="3.5" rx="1.5" fill="#1E1A16"/>
  <circle cx="66" cy="158" r="2.2" fill="#1E1A16"/>

  <!-- horizontal reference line from muzzle -->
  <line x1="70" y1="160" x2="360" y2="160" stroke="#8A7B5E" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="200" y="150" font-size="11" fill="#8A7B5E">horizontal reference</text>

  <!-- bullet path: muzzle (70,160) to neck (930,251.2) -->
  <line x1="70" y1="160" x2="930" y2="251.2" stroke="#7A1F2B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- angle arc + label -->
  <path d="M 190,160 A 120,120 0 0 1 188.3,172.7" fill="none" stroke="#7A1F2B" stroke-width="1.5"/>
  <text x="204" y="176" font-size="14" fill="#7A1F2B" font-weight="bold">6.1&#176;</text>

  <!-- tent at courtyard end (10 ft wide, 6.5 ft eave, 10 ft peak) -->
  <path d="M 916,247 L 926,240 L 936,247" fill="none" stroke="#1E1A16" stroke-width="1.5"/>
  <line x1="916" y1="247" x2="916" y2="260" stroke="#1E1A16" stroke-width="1.2"/>
  <line x1="936" y1="247" x2="936" y2="260" stroke="#1E1A16" stroke-width="1.2"/>
  <!-- Kirk seated: neck at 4.4 ft -->
  <circle cx="930" cy="250" r="1.8" fill="#1E1A16"/>
  <line x1="930" y1="251.8" x2="930" y2="257" stroke="#1E1A16" stroke-width="1.5"/>
  <text x="856" y="234" font-size="11" fill="#5A5347">TENT + KIRK</text>

  <!-- distance dimension -->
  <line x1="70" y1="292" x2="930" y2="292" stroke="#5A5347" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="70" y1="264" x2="70" y2="298" stroke="#5A5347" stroke-width="0.75" stroke-dasharray="3,3"/>
  <line x1="930" y1="264" x2="930" y2="298" stroke="#5A5347" stroke-width="0.75" stroke-dasharray="3,3"/>
  <text x="452" y="310" font-size="13" fill="#1E1A16" font-weight="bold">430 FT (&#8776;143 yards)</text>

  <!-- drop dimension -->
  <line x1="968" y1="160" x2="968" y2="251.2" stroke="#5A5347" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="70" y1="160" x2="968" y2="160" stroke="#5A5347" stroke-width="0.5" stroke-dasharray="2,4"/>
  <text x="962" y="150" font-size="11" fill="#1E1A16" font-weight="bold" text-anchor="end">~45.6 FT DROP</text>

  <!-- L-shaped scale proof: 50 ft each direction -->
  <path d="M 90,392 L 90,342 M 90,392 L 190,392" stroke="#1E1A16" stroke-width="2"/>
  <text x="198" y="396" font-size="11" fill="#1E1A16">50 ft</text>
  <text x="84" y="336" font-size="11" fill="#1E1A16">50 ft</text>
  <text x="90" y="416" font-size="11" fill="#8A7B5E" font-style="italic">equal-scale proof: both bars are the same length per foot</text>

  <line x1="60" y1="436" x2="940" y2="436" stroke="#C9A227" stroke-width="1.5"/>

  <!-- ============ INSET: LAST 45 FT AT 8X ZOOM (16 px per foot) ============ -->
  <text x="60" y="462" font-size="15" fill="#1E1A16" font-weight="bold">INSET: FINAL 40 FT, MAGNIFIED 8&#215; (still equal scale both axes)</text>

  <!-- ground -->
  <rect x="160" y="590" width="720" height="10" fill="#E4DAC4" stroke="#B7A98A" stroke-width="1"/>

  <!-- bullet path: (160,452) to neck (800,519.6) -->
  <line x1="160" y1="452" x2="800" y2="519.6" stroke="#7A1F2B" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="180" y="444" font-size="12" fill="#7A1F2B" font-weight="bold">bullet path, 6.1&#176; down</text>

  <!-- tent: near leg 423 ft (x=688), peak 428 (x=768, y=430), far leg 433 (x=848) -->
  <path d="M 688,486 L 768,430 L 848,486" fill="none" stroke="#1E1A16" stroke-width="2.5"/>
  <line x1="688" y1="486" x2="688" y2="590" stroke="#1E1A16" stroke-width="2"/>
  <line x1="848" y1="486" x2="848" y2="590" stroke="#1E1A16" stroke-width="2"/>
  <text x="676" y="420" font-size="12" fill="#5A5347">canopy peak ~10 ft</text>
  <text x="560" y="478" font-size="12" fill="#5A5347" text-anchor="end">eave ~6.5 ft &#8594;</text>

  <!-- clearance callout at eave: bullet y=507.8 vs eave 486 -->
  <line x1="688" y1="486" x2="688" y2="507.8" stroke="#C9A227" stroke-width="3"/>
  <line x1="660" y1="486" x2="688" y2="486" stroke="#C9A227" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="660" y1="507.8" x2="688" y2="507.8" stroke="#C9A227" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="652" y="502" font-size="13" fill="#9A7A0E" font-weight="bold" text-anchor="end">&#8776;16 in clearance</text>
  <text x="652" y="518" font-size="11" fill="#9A7A0E" text-anchor="end">under the eave</text>

  <!-- Kirk seated at 430 ft (x=800): neck 4.4 ft (y=519.6) -->
  <circle cx="800" cy="509" r="7" fill="#1E1A16"/>
  <path d="M 800,516 L 800,556 L 816,556 L 816,588" fill="none" stroke="#1E1A16" stroke-width="5" stroke-linecap="round"/>
  <!-- chair -->
  <path d="M 786,556 L 802,556 M 792,556 L 792,590" stroke="#8A7B5E" stroke-width="3"/>
  <!-- impact marker at neck -->
  <circle cx="800" cy="519.6" r="4" fill="none" stroke="#7A1F2B" stroke-width="2"/>
  <text x="812" y="524" font-size="12" fill="#7A1F2B" font-weight="bold">neck, 4.4 ft</text>

  <!-- height ticks -->
  <line x1="160" y1="590" x2="160" y2="430" stroke="#8A7B5E" stroke-width="1"/>
  <g font-size="10" fill="#8A7B5E">
    <line x1="155" y1="558" x2="165" y2="558" stroke="#8A7B5E"/><text x="140" y="562" text-anchor="end">2 ft</text>
    <line x1="155" y1="526" x2="165" y2="526" stroke="#8A7B5E"/><text x="140" y="530" text-anchor="end">4 ft</text>
    <line x1="155" y1="494" x2="165" y2="494" stroke="#8A7B5E"/><text x="140" y="498" text-anchor="end">6 ft</text>
    <line x1="155" y1="462" x2="165" y2="462" stroke="#8A7B5E"/><text x="140" y="466" text-anchor="end">8 ft</text>
  </g>

  <!-- footnote -->
  <text x="60" y="636" font-size="11" fill="#8A7B5E" font-style="italic">Confirmed: ~430 ft distance, rooftop prone position (charging docs). Estimated: ~50 ft muzzle height incl. terrain, 6.5 ft eave, 4.4 ft seated neck height. Angle range across estimates: 4&#8211;8&#176;.</text>
</svg>
